<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEXT</title>
  <meta name="description" content="TEXT" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===================== ENVELOPE INTRO ===================== -->
  <div id="envelope-overlay" role="button" tabindex="0" aria-label="TEXT">
    <div class="night-sky">
      <span class="star s1"></span><span class="star s2"></span><span class="star s3"></span>
      <span class="star s4"></span><span class="star s5"></span><span class="star s6"></span>
      <span class="star s7"></span><span class="star s8"></span>
      <div class="moon"></div>
    </div>

    <div class="envelope-scene">
      <div class="letter">
        <div class="letter-face">
          <p class="letter-kicker">TEXT</p>
          <p class="letter-title">TEXT</p>
          <div class="letter-paw">❤️</div>
        </div>
      </div>

      <div class="envelope">
        <div class="envelope-back"></div>
        <div class="envelope-flap">
          <div class="wax-seal">❤️</div>
        </div>
        <div class="envelope-front-left"></div>
        <div class="envelope-front-right"></div>
      </div>
    </div>

    <p class="tap-hint">TEXT</p>
  </div>

  <!-- ===================== MAIN SITE ===================== -->
  <main id="site" aria-hidden="true">

    <header class="hero">
      <div class="hero-ears" aria-hidden="true">
        <span class="ear ear-left"></span>
        <span class="ear ear-right"></span>
      </div>
      <p class="hero-eyebrow">TEXT</p>
      <h1 class="hero-title">TEXT</h1>
      <p class="hero-sub">TEXT</p>
      <a href="#pinboard" class="hero-scroll">
        <span>TEXT</span>
        <svg width="14" height="20" viewBox="0 0 14 20" fill="none"><path d="M7 1v17M1 12l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </header>

    <!-- ===================== CAROUSEL SECTION ===================== -->
    <section class="carousel-section" aria-label="TEXT">
      <p class="section-eyebrow">TEXT</p>
      <h2 class="section-title">TEXT</h2>

      <div class="carousel" id="carousel">
        <div class="clothesline" aria-hidden="true"></div>

        <div class="carousel-track" id="carousel-track">

          <!-- SLIDE 1 -->
          <figure class="slide">
            <span class="peg" aria-hidden="true">TEXT</span>
            <div class="polaroid">
              <div class="polaroid-img-wrap">
                <img src="assets/photo1.png" alt="TEXT" class="polaroid-img" />
                <span class="paw-badge top-left">TEXT</span>
              </div>
              <figcaption>TEXT</figcaption>
            </div>
          </figure>

          <!-- SLIDE 2 -->
          <figure class="slide">
            <span class="peg" aria-hidden="true">TEXT</span>
            <div class="polaroid">
              <div class="polaroid-img-wrap">
                <img src="assets/photo2.png" alt="TEXT" class="polaroid-img" />
                <span class="paw-badge bottom-right">TEXT</span>
              </div>
              <figcaption>TEXT</figcaption>
            </div>
          </figure>

          <!-- SLIDE 3 -->
          <figure class="slide">
            <span class="peg" aria-hidden="true">TEXT</span>
            <div class="polaroid">
              <div class="polaroid-img-wrap">
                <img src="assets/photo3.png" alt="TEXT" class="polaroid-img" />
                <span class="paw-badge top-right">TEXT</span>
              </div>
              <figcaption>TEXT</figcaption>
            </div>
          </figure>

          <!-- SLIDE 4 -->
          <figure class="slide">
            <span class="peg" aria-hidden="true">TEXT</span>
            <div class="polaroid">
              <div class="polaroid-img-wrap">
                <img src="assets/photo4.png" alt="TEXT" class="polaroid-img" />
                <span class="paw-badge bottom-left">TEXT</span>
              </div>
              <figcaption>TEXT</figcaption>
            </div>
          </figure>


          <!-- SLIDE 5 -->
          <figure class="slide">
            <span class="peg" aria-hidden="true">TEXT</span>
            <div class="polaroid">
              <div class="polaroid-img-wrap">
                <img src="assets/photo4.png" alt="TEXT" class="polaroid-img" />
                <span class="paw-badge bottom-left">TEXT</span>
              </div>
              <figcaption>TEXT</figcaption>
            </div>
          </figure>

        </div>

        <button class="carousel-btn prev" id="prev-btn" aria-label="TEXT">&#10094;</button>
        <button class="carousel-btn next" id="next-btn" aria-label="TEXT">&#10095;</button>

        <div class="carousel-dots" id="carousel-dots"></div>
      </div>
    </section>

    <!-- ===================== PINBOARD SECTION ===================== -->
    <section class="pinboard-section" id="pinboard" aria-label="TEXT">
      <p class="section-eyebrow">TEXT</p>
      <h2 class="section-title">TEXT</h2>
      <p class="section-sub">TEXT</p>

      <form id="note-form" class="note-form">
        <label class="visually-hidden" for="note-name">TEXT</label>
        <input id="note-name" name="name" type="text" placeholder="TEXT" maxlength="60" />

        <label class="visually-hidden" for="note-message">TEXT</label>
        <textarea id="note-message" name="message" placeholder="TEXT" maxlength="500" rows="3" required></textarea>

        <button type="submit" id="note-submit">
          <span class="btn-label">TEXT</span>
          <span class="btn-paw">TEXT</span>
        </button>
        <p class="form-status" id="form-status" role="status"></p>
      </form>

      <div class="corkboard" id="corkboard" aria-live="polite">
        <p class="corkboard-empty" id="corkboard-empty">TEXT</p>
      </div>
    </section>

    <footer class="site-footer">
      <p>TEXT</p>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
