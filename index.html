<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Looking Glass</title>
  <meta name="description" content="Looking Glass" /> <!--Page description for SEO and social sharing-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪞</text></svg>" />
</head>
<body>

  <!-- ===================== ENVELOPE INTRO ===================== -->
  <div id="envelope-overlay" role="button" tabindex="0" aria-label="Skip opening animation">
    <div class="night-sky">
      <span class="star s1"></span><span class="star s2"></span><span class="star s3"></span>
      <span class="star s4"></span><span class="star s5"></span><span class="star s6"></span>
      <span class="star s7"></span><span class="star s8"></span>
      <div class="moon"></div>
    </div>

    <div class="envelope-scene">
      <div class="letter">
        <div class="letter-face">
        </div>
      </div>

      <div class="envelope">
        <div class="envelope-back"></div>
        <div class="envelope-flap">
          <div class="wax-seal"></div>
        </div>
        <div class="envelope-front-left"></div>
        <div class="envelope-front-right"></div>
      </div>
    </div>

    <p class="tap-hint">tap anywhere to open</p>
  </div>

  <!-- ===================== MAIN SITE ===================== -->
  <main id="site" aria-hidden="true">

    <header class="hero">
      <div class="hero-ears" aria-hidden="true">
        <span class="ear ear-left"></span>
        <span class="ear ear-right"></span>
      </div>
      <p class="hero-eyebrow">Hey, Alyssa!</p>
      <h1 class="hero-title">Welcome to the Looking Glass</h1>
      <p class="hero-sub">In case you missed us, here are some memories we had uwu</p>
      <a href="#pinboard" class="hero-scroll">
        <span>leave a note</span>
        <svg width="14" height="20" viewBox="0 0 14 20" fill="none"><path d="M7 1v17M1 12l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </header>

    <!-- ===================== CAROUSEL SECTION ===================== -->
    <section class="carousel-section" aria-label="Photo carousel">
      <p class="section-eyebrow">Gallery</p>
      <h2 class="section-title">CHANGE LATER</h2>

      <div class="carousel" id="carousel">
        <div class="clothesline" aria-hidden="true"></div>

        <div class="carousel-track-wrapper">
          <div class="carousel-track" id="carousel-track"></div>
        </div>

        <button class="carousel-btn prev" id="prev-btn" aria-label="Previous photo">&#10094;</button>
        <button class="carousel-btn next" id="next-btn" aria-label="Next photo">&#10095;</button>

        <div class="carousel-dots" id="carousel-dots"></div>

        <div class="mode-toggle-wrap">
          <button type="button" id="toggle-gallery-btn" class="gallery-toggle-btn">
            <span class="btn-icon">🖼️</span> View All Photos (Gallery Mode)
          </button>
        </div>
      </div>

      <!-- GALLERY GRID VIEW -->
      <div class="gallery-view" id="gallery-view" hidden>
        <div class="gallery-header">
          <button type="button" class="back-to-carousel-btn" id="back-to-carousel-btn">
            <span>🖼️</span> Back to Carousel
          </button>
        </div>
        <div class="gallery-grid" id="gallery-grid"></div>
      </div>
    </section>

    <!-- LIGHTBOX MODAL FOR GALLERY IMAGES -->
    <div id="gallery-lightbox" class="gallery-lightbox" aria-hidden="true">
      <span class="lightbox-close" id="lightbox-close">&times;</span>
      <img id="lightbox-img" class="lightbox-content" alt="Enlarged view" />
    </div>

    <!-- ===================== PINBOARD SECTION ===================== -->
    <section class="pinboard-section" id="pinboard" aria-label="Leave a note">
      <p class="section-eyebrow">CHANGE LATER 🐾</p>
      <h2 class="section-title">CHANGE LATER</h2>
      <p class="section-sub">CHANGE LATER</p>

      <form id="note-form" class="note-form">
        <label class="visually-hidden" for="note-name">Your name</label>
        <input id="note-name" name="name" type="text" placeholder="Your name (or nickname)" maxlength="60" />

        <label class="visually-hidden" for="note-message">Note Message</label>
        <textarea id="note-message" name="message" placeholder="Write your note here..." maxlength="2000" rows="3" required></textarea>

        <button type="submit" id="note-submit">
          <span class="btn-label">Pin it</span>
          <span class="btn-paw">🐾</span>
        </button>
        <p class="form-status" id="form-status" role="status"></p>
      </form>

      <div class="corkboard" id="corkboard" aria-live="polite">
        <p class="corkboard-empty" id="corkboard-empty">Loading notes…</p>
      </div>
    </section>

    <footer class="site-footer">
      <p> <3 </p>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
